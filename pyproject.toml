[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tcm-mcp-server"
version = "0.1.0"
description = "TCM Constitution MCP Server"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
# 这里定义的 'tcm-mcp' 命令会指向 server.py 中的 main 函数
tcm-mcp = "server:main"